    <!-- Apply the persisted/OS theme before React mounts to avoid a light-flash in dark mode -->
    <script>
        try {
            var t = localStorage.getItem('tristar_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', t);
        } catch (e) { }
    </script>

    <!-- Google Fonts: Big Shoulders Display 900 & Archivo 400/600 -->
